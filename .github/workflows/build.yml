name: Собрать SHKWIZI Remote (iPhone + Windows)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Нарисовать иконки
        run: |
          pip install pillow
          python resources/make_icon.py
      - name: Установить Capacitor
        run: npm install
      - name: Создать iOS-проект
        run: npx cap add ios
      - name: Иконка и настройки
        run: |
          set -e
          ICONSET=ios/App/App/Assets.xcassets/AppIcon.appiconset
          for f in "$ICONSET"/*.png; do cp resources/AppIcon-1024.png "$f"; done
          PL=ios/App/App/Info.plist
          PB=/usr/libexec/PlistBuddy
          $PB -c "Set :CFBundleDisplayName Remote" $PL || $PB -c "Add :CFBundleDisplayName string Remote" $PL
          $PB -c "Add :NSLocalNetworkUsageDescription string 'Чтобы найти твой компьютер в Wi-Fi сети и управлять им'" $PL || true
          $PB -c "Add :NSAppTransportSecurity dict" $PL || true
          $PB -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" $PL || true
          $PB -c "Add :NSAppTransportSecurity:NSAllowsLocalNetworking bool true" $PL || true
          $PB -c "Add :CFBundleURLTypes array" $PL || true
          $PB -c "Add :CFBundleURLTypes:0 dict" $PL
          $PB -c "Add :CFBundleURLTypes:0:CFBundleURLName string com.shkwizi.remote" $PL
          $PB -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" $PL
          $PB -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string shkwizi-remote" $PL
          $PB -c "Add :UIStatusBarStyle string UIStatusBarStyleLightContent" $PL || true
          $PB -c "Add :UIViewControllerBasedStatusBarAppearance bool false" $PL || true
      - name: Синхронизировать веб-часть
        run: npx cap sync ios
      - name: Собрать без подписи
        run: |
          set -e
          cd ios/App
          if [ -d App.xcworkspace ]; then TARGET="-workspace App.xcworkspace"; else TARGET="-project App.xcodeproj"; fi
          xcodebuild $TARGET -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$GITHUB_WORKSPACE/build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION=1.0.${{ github.run_number }} CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            build | tail -n 40
      - name: Упаковать IPA
        run: |
          set -e
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          mkdir -p Payload && cp -R "$APP" Payload/
          zip -qry SHKWIZI-Remote.ipa Payload
          ls -lh SHKWIZI-Remote.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: SHKWIZI-Remote.ipa

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Библиотеки
        run: pip install pillow mss aiohttp qrcode pyinstaller
      - name: Иконки
        run: python resources/make_icon.py
      - name: Собрать SHKWIZI-Remote.exe
        run: pyinstaller --onefile --windowed --noconfirm --name SHKWIZI-Remote --icon resources/icon.ico --collect-submodules aiohttp --hidden-import PIL.ImageTk server/shkwizi_remote.py
      - uses: actions/upload-artifact@v4
        with:
          name: exe
          path: dist/SHKWIZI-Remote.exe

  release:
    needs: [ios, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Выложить в Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: SHKWIZI Remote 1.0.${{ github.run_number }}
          body: |
            📱 iPhone: скачай SHKWIZI-Remote.ipa на айфоне → «Открыть в ESign» → подписать и установить.
            💻 Windows: скачай SHKWIZI-Remote.exe и запусти (установка не нужна). Брандмауэр — «Разрешить» для частной сети.
          files: |
            SHKWIZI-Remote.ipa
            SHKWIZI-Remote.exe
          make_latest: true
